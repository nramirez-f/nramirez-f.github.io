<!doctype html>
<!--
  Template for public/og.png, the 1200×630 preview shown when the site is
  shared (LinkedIn, WhatsApp, Slack…). Regenerate with:
    firefox --headless --window-size=1200,630 --screenshot ~/og.png file://$PWD/scripts/og-image.html
    mv ~/og.png public/og.png
-->
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'LM';
        src: url('../src/assets/fonts/LM-regular.woff2') format('woff2');
        font-weight: 400;
      }
      @font-face {
        font-family: 'LM';
        src: url('../src/assets/fonts/LM-bold.woff2') format('woff2');
        font-weight: 700;
      }
      @font-face {
        font-family: 'LM';
        src: url('../src/assets/fonts/LM-italic.woff2') format('woff2');
        font-style: italic;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #fdfcf8;
        color: #1b1b1b;
        font-family: 'LM', Georgia, serif;
      }
      main {
        position: relative;
        box-sizing: border-box;
        height: 100%;
        padding: 72px 96px;
      }
      h1 {
        margin: 0;
        font-size: 74px;
        line-height: 1.05;
        letter-spacing: -0.5px;
      }
      .rule {
        width: 140px;
        height: 2px;
        margin: 30px 0 26px;
        background: #1b1b1b;
      }
      p {
        margin: 0 0 6px;
        font-size: 32px;
        color: #3b3b40;
      }
      p.en {
        font-style: italic;
        color: #6a6a70;
        font-size: 28px;
        margin-top: 10px;
      }
      .url {
        position: absolute;
        right: 96px;
        top: 80px;
        font-size: 26px;
        color: #1f4e8c;
      }
      svg {
        position: absolute;
        left: 0;
        bottom: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="url">www.nramirez.es</div>
      <h1>José Ignacio<br />Ramírez-Fuentes</h1>
      <div class="rule"></div>
      <p>Doctorando en Matemática Aplicada</p>
      <p>Grupo EDANYA · Universidad de Málaga</p>
      <p class="en">PhD student in Applied Mathematics</p>
    </main>
    <!-- Water layer and bed, as in the research figure. -->
    <svg width="1200" height="130" viewBox="0 0 1200 130">
      <path
        d="M0,52 C140,22 230,10 340,40 C450,70 540,78 660,46 C780,14 880,18 990,44 C1080,64 1140,58 1200,46 L1200,130 L0,130 Z"
        fill="#dceaf7"
      />
      <path
        d="M0,52 C140,22 230,10 340,40 C450,70 540,78 660,46 C780,14 880,18 990,44 C1080,64 1140,58 1200,46"
        fill="none"
        stroke="#3a6ea5"
        stroke-width="2"
      />
      <path d="M0,108 C200,100 360,116 560,104 C760,92 920,112 1200,102 L1200,130 L0,130 Z" fill="#efe3d5" />
      <path
        d="M0,108 C200,100 360,116 560,104 C760,92 920,112 1200,102"
        fill="none"
        stroke="#7a5a3a"
        stroke-width="1.5"
      />
    </svg>
  </body>
</html>
