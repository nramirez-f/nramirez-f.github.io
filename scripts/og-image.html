<!doctype html>
<!--
  Template for public/og.png, the 1200×630 preview shown when the site is
  shared (LinkedIn, WhatsApp, Slack…). Same palette and type as the site
  (src/styles/global.css); Libertinus loads from the Fontsource CDN.
  Regenerate with:
    firefox --headless --window-size=1200,630 --screenshot ~/og.png file://$PWD/scripts/og-image.html
    mv ~/og.png public/og.png
-->
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Libertinus Serif';
        src: url('https://cdn.jsdelivr.net/fontsource/fonts/libertinus-serif@latest/latin-700-normal.woff2') format('woff2');
        font-weight: 700;
      }
      @font-face {
        font-family: 'Libertinus Sans';
        src: url('https://cdn.jsdelivr.net/fontsource/fonts/libertinus-sans@latest/latin-400-normal.woff2') format('woff2');
        font-weight: 400;
      }
      @font-face {
        font-family: 'Libertinus Sans';
        src: url('https://cdn.jsdelivr.net/fontsource/fonts/libertinus-sans@latest/latin-700-normal.woff2') format('woff2');
        font-weight: 700;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #ffffff;
        color: #0f1b2a;
        font-family: 'Libertinus Sans', system-ui, sans-serif;
      }
      main {
        position: relative;
        box-sizing: border-box;
        height: 100%;
        padding: 84px 80px;
      }
      h1 {
        margin: 0;
        font-family: 'Libertinus Serif', Georgia, serif;
        font-weight: 700;
        font-size: 96px;
        line-height: 1.02;
        letter-spacing: -1px;
      }
      p {
        margin: 26px 0 0;
        font-size: 34px;
        font-weight: 700;
      }
      p.en {
        margin-top: 4px;
        font-weight: 400;
        color: #4a5a70;
        font-size: 28px;
      }
      .url {
        position: absolute;
        right: 80px;
        top: 78px;
        font-size: 26px;
        font-weight: 700;
        color: #1d5fb4;
      }
      svg {
        position: absolute;
        left: 0;
        bottom: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="url">www.nramirez.es</div>
      <h1>José Ignacio<br />Ramírez-Fuentes</h1>
      <p>Doctorando en Matemática Aplicada</p>
      <p class="en">PhD student in Applied Mathematics</p>
    </main>
    <!-- Free surface and sand bed, as in the hero. -->
    <svg width="1200" height="150" viewBox="0 0 1200 150">
      <path
        d="M0,52 C140,22 230,10 340,40 C450,70 540,78 660,46 C780,14 880,18 990,44 C1080,64 1140,58 1200,46 L1200,150 L0,150 Z"
        fill="#2a78d6"
        fill-opacity="0.18"
      />
      <path
        d="M0,52 C140,22 230,10 340,40 C450,70 540,78 660,46 C780,14 880,18 990,44 C1080,64 1140,58 1200,46"
        fill="none"
        stroke="#2a78d6"
        stroke-width="3"
      />
      <path d="M0,118 C200,104 360,126 560,112 C760,98 920,120 1200,106 L1200,150 L0,150 Z" fill="#e6d6b8" />
      <path d="M0,118 C200,104 360,126 560,112 C760,98 920,120 1200,106" fill="none" stroke="#b08a52" stroke-width="3" />
    </svg>
  </body>
</html>
